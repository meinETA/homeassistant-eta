name: Plant card
description: The ETA Plant card does not show my plant correctly
title: "Plant card: "
labels: ["plant-card"]
body:
  - type: markdown
    attributes:
      value: |
        First press **Upload Plant Data** on the ETA device (Settings → Devices & services → ETA Heating → ETA device → Diagnostic). The plant data goes encrypted to the maintainers; only they can read it.
        Then open the card settings (gear) and click **Open GitHub issue**: it fills in your instance UUID.

        Issues are public. Do not attach diagnostics or other files with plant data.
  - type: input
    id: uuid
    attributes:
      label: Instance UUID
      description: Settings → Devices & services → ETA Heating → Configure → Plant data upload (also the diagnostic sensor "Instance UUID").
      placeholder: 00000000-0000-4000-x000-000000000000
    validations:
      required: true
  - type: checkboxes
    id: uploaded
    attributes:
      label: Plant data
      options:
        - label: I pressed **Upload Plant Data** on the ETA device.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Which part of the plant is missing, wrong or in the wrong place?
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a screenshot of the card here. Check it for personal names first.
    validations:
      required: false
