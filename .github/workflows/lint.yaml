name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
