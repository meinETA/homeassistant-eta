name: Store plant files

# Copies plant files attached to plant card issues (and their comments) into the
# private fixtures repository (meinETA/eta-dev), so new plants can be analysed and become tests.
# Plant files are encrypted by the integration (only eta-dev can read them); older
# unencrypted uploads are copied too and their link / data block is then removed from the issue.
# Issue content is untrusted: nothing from it is executed or put into a shell;
# only GitHub attachment links to .json files are downloaded, checked and stored.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  store:
    if: >-
      !github.event.issue.pull_request && (
        contains(github.event.issue.labels.*.name, 'plant-card') ||
        startsWith(github.event.issue.title, 'Plant card'))
    runs-on: ubuntu-latest
    concurrency:
      group: plant-file-${{ github.event.issue.number }}
    steps:
      - name: Copy attached plant files
        uses: actions/github-script@v7
        env:
          ISSUES_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.ETA_FIXTURES_TOKEN }}
          script: |
            const zlib = require("zlib");
            const MAX = 5 * 1024 * 1024;
            const issue = context.payload.issue.number;
            const comment = context.payload.comment;
            let text = (comment ? comment.body : context.payload.issue.body) || "";
            const source = comment ? `c${comment.id}` : "issue";
            const files = [];
            const sealed = (d) => d && d.eta_plant_file === "sealed" && typeof d.data === "string";

            // attachments: only GitHub's own attachment links to .json files
            const links = [...text.matchAll(/https:\/\/github\.com\/user-attachments\/files\/\d+\/[A-Za-z0-9._-]+\.json/g)].map((m) => m[0]);
            for (const url of [...new Set(links)].slice(0, 5)) {
              const res = await fetch(url, { redirect: "follow" });
              if (!res.ok) { core.warning(`download failed ${res.status}: ${url}`); continue; }
              const buf = Buffer.from(await res.arrayBuffer());
              if (buf.length > MAX) { core.warning(`too large: ${url}`); continue; }
              files.push({ name: url.split("/").pop(), body: buf.toString("utf8"), url });
            }

            // short report filled in by the card: v3 encrypted, v1/v2 gzip+base64 (older cards)
            const v3 = text.match(/eta-plant-report v3, sealed\s*(?:```[a-z]*\s*)?([A-Za-z0-9+\/=_\-\s]{40,})/);
            if (v3) {
              // the card writes URL-safe base64 without padding
              let data = v3[1].replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
              data += "=".repeat((4 - (data.length % 4)) % 4);
              files.push({ name: "summary.json", body: JSON.stringify({ eta_plant_file: "sealed", v: 1, data }) });
            }
            const old = text.match(/eta-plant-report v[12], gzip\+base64[):\s]*(?:```[a-z]*\s*)?([A-Za-z0-9+\/=\s]{40,})/);
            if (old) {
              try {
                const raw = zlib.gunzipSync(Buffer.from(old[1].replace(/\s+/g, ""), "base64"));
                if (raw.length <= MAX) files.push({ name: "summary.json", body: raw.toString("utf8"), block: old[1] });
              } catch (err) { core.warning(`summary not readable: ${err.message}`); }
            }

            const plain = [];
            for (const f of files) {
              let data;
              try { data = JSON.parse(f.body); } catch { core.warning(`not JSON: ${f.name}`); continue; }
              // diagnostics download of the integration: its plant file part
              const diag = data && data.data && data.data.plant_file;
              if (sealed(diag)) data = diag;
              if (!data || typeof data !== "object" || !(sealed(data) || data.objects || data.tree)) {
                core.warning(`not a plant file: ${f.name}`); continue;
              }
              const safe = f.name.replace(/[^A-Za-z0-9._-]/g, "_").slice(0, 80);
              const path = `plants/inbox/issue-${issue}-${source}-${safe}`;
              const content = Buffer.from(JSON.stringify(data, null, 1) + "\n").toString("base64");
              let sha;
              try {
                const cur = await github.rest.repos.getContent({ owner: "meinETA", repo: "eta-dev", path });
                sha = cur.data.sha;
              } catch { /* new file */ }
              await github.rest.repos.createOrUpdateFileContents({
                owner: "meinETA", repo: "eta-dev", path, sha, content,
                message: `Plant file from issue ${issue}`,
              });
              core.info(`stored ${path}${sealed(data) ? " (encrypted)" : ""}`);
              if (!sealed(data)) plain.push(f);
            }
            if (!files.length) core.info("no plant file in this issue or comment");

            // unencrypted plant data stays out of the public issue once it is stored
            if (plain.length) {
              const urls = new Set(plain.map((f) => f.url).filter(Boolean));
              const gone = "_(plant file stored privately)_";
              text = text.replace(/\[[^\]]*\]\((https:\/\/github\.com\/user-attachments\/files\/\d+\/[A-Za-z0-9._-]+\.json)\)/g,
                (m, u) => (urls.has(u) ? gone : m));
              urls.forEach((u) => { text = text.split(u).join(gone); });
              plain.filter((f) => f.block).forEach((f) => { text = text.split(f.block).join("\n_(stored privately)_\n"); });
              const gh = getOctokit(process.env.ISSUES_TOKEN);
              const { owner, repo } = context.repo;
              if (comment) await gh.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body: text });
              else await gh.rest.issues.update({ owner, repo, issue_number: issue, body: text });
              core.info(`removed ${plain.length} unencrypted plant file(s) from the issue`);
            }
